<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Acquista USDT</title>

  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#0a1a2e;
      --card:#0f1730cc;
      --text:#e9eeff;
      --muted:#a9b5e7;
      --accent:#6ae4ff;
      --accent2:#9b7bff;
      --shadow:0 22px 60px rgba(0,0,0,.45);
      --radius:22px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% 10%, rgba(106,228,255,.22), transparent 60%),
        radial-gradient(900px 500px at 90% 30%, rgba(155,123,255,.18), transparent 55%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(520px,100%);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
      display:grid;
      gap:16px;
      position:relative;
      overflow:hidden;
    }

    h1{margin:0;font-size:22px}
    .sub{font-size:13px;color:var(--muted)}

    .panel{
      background:rgba(0,0,0,.2);
      border-radius:18px;
      padding:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .token{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
    }

    .token svg{width:28px;height:28px}

    input{
      width:180px;
      text-align:right;
      font-size:22px;
      font-weight:900;
      background:transparent;
      border:none;
      color:var(--text);
      outline:none;
    }

    .rate{font-size:13px;color:var(--muted)}

    #outBox{
      font-size:22px;
      font-weight:900;
      min-width:140px;
      text-align:right;
    }

    #spinner{
      display:none;
      margin-left:6px;
      vertical-align:middle;
    }

    /* === PAGE LOADER === */
    .page-loader{
      position:absolute;
      inset:0;
      background:rgba(5,8,18,.85);
      backdrop-filter:blur(10px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:10;
      animation:fadeOut .6s ease forwards;
      animation-delay:900ms;
    }

    @keyframes fadeOut{
      to{opacity:0;visibility:hidden}
    }
  </style>
</head>

<body>

<div class="card">

  <!-- PAGE LOADER -->
  <div class="page-loader">
    <svg width="42" height="42" viewBox="0 0 50 50">
      <circle cx="25" cy="25" r="20" fill="none"
        stroke="#6ae4ff" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="90 150">
        <animateTransform attributeName="transform"
          type="rotate" from="0 25 25" to="360 25 25"
          dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </svg>
  </div>

  <div>
    <h1>Acquista USDT</h1>
    <div class="sub">ChangeKeys? (Ultimo aggiornamento 11/01/2025)
	</div>
	<div class="sub">LE RATE POTREBBERO NON ESSERE ACCURATE ALL'ATTUALE VENDITA DI MERCATO CHANGEKEYS?! ASSICURARSI PRIMA DI ORDINARE</div>
  </div>

  <!-- CHF -->
  <div class="panel">
    <div class="token">
      <svg viewBox="0 0 64 64">
        <rect width="64" height="64" rx="12" fill="#d52b1e"/>
        <rect x="26" y="14" width="12" height="36" fill="#fff"/>
        <rect x="14" y="26" width="36" height="12" fill="#fff"/>
      </svg>
      CHF
    </div>
    <input id="chfInput" placeholder="0.00" />
  </div>

  <!-- EUR -->
  <div class="panel">
    <div class="token">

      <!-- USDT FIXED SVG -->
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="32" fill="#26a17b"/>
        <path fill="#fff" d="
          M20 18h24v6H34v4.4c7.5.4 13 2 13 3.9s-5.5 3.5-13 3.9V46h-4V36.2
          c-7.5-.4-13-2-13-3.9s5.5-3.5 13-3.9V24H20z
        "/>
      </svg>

      <!-- EUR -->
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="32" fill="#1e40af"/>
        <text x="32" y="42" text-anchor="middle" font-size="36" fill="#fff">€</text>
      </svg>

      EUR
    </div>

    <div id="outBox">
      <span id="out">—</span>
      <span id="spinner">
        <svg width="18" height="18" viewBox="0 0 50 50">
          <circle cx="25" cy="25" r="20" fill="none"
            stroke="#6ae4ff" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="90 150">
            <animateTransform attributeName="transform"
              type="rotate" from="0 25 25" to="360 25 25"
              dur="0.8s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </span>
    </div>
  </div>

  <div class="rate">
    Rata: <b>7%</b> + <b>1.17 USDT/CHF</b> -> EUR
  </div>

</div>

<script>
  const FEE = 0.7;
  const RATE = 1.17;

  const chfInput = document.getElementById('chfInput');
  const out = document.getElementById('out');
  const spinner = document.getElementById('spinner');

  let timer = null;
  let usdToEur = null;

  function floor2(n){
    return Math.floor(n * 100) / 100;
  }

  function parseCHF(v){
    if(!v) return NaN;
    const cleaned = v
      .replace(/\s+/g,'')
      .replace(/'/g,'')
      .replace(/,/g,'.')
      .replace(/[^0-9.]/g,'');
    const n = Number(cleaned);
    return Number.isFinite(n) ? n : NaN;
  }

  async function getUsdToEur(){
    if(usdToEur) return usdToEur;
    const res = await fetch(
      'https://api.frankfurter.app/latest?from=USD&to=EUR'
    );
    const data = await res.json();
    usdToEur = data.rates.EUR;
    return usdToEur;
  }

  chfInput.addEventListener('input', () => {
    clearTimeout(timer);

    const chf = parseCHF(chfInput.value);
    if(!Number.isFinite(chf) || chf <= 0){
      out.textContent = '—';
      spinner.style.display = 'none';
      return;
    }

    spinner.style.display = 'inline-block';
    out.textContent = '';

    timer = setTimeout(async () => {
      const fx = await getUsdToEur();

      const netChf = floor2(chf * (1 - FEE));
      const usdt = floor2(netChf * RATE);
      const eur = floor2(usdt * fx);

      spinner.style.display = 'none';
      out.textContent = eur.toFixed(2) + ' €';
    }, 600);
  });
</script>

</body>
</html>
